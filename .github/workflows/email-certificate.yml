name: Email certificate

# Manually-triggered: email an already-issued certificate PDF to a recipient.
# Requires repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and
# BREVO_API_KEY (optionally BREVO_FROM).
on:
  workflow_dispatch:
    inputs:
      certificate_id:
        description: "Certificate ID to email (e.g. AAI-GHG-CA-...)"
        required: true
        type: string
      to:
        description: "Recipient email (blank = the certificate's own email)"
        required: false
        type: string

concurrency:
  group: email-certificate
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send certificate email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM: ${{ secrets.BREVO_FROM }}
          IN_CERT_ID: ${{ github.event.inputs.certificate_id }}
          IN_TO: ${{ github.event.inputs.to }}
        run: |
          TO_FLAG=""
          if [ -n "$IN_TO" ]; then TO_FLAG="--to $IN_TO"; fi
          python send_certificate_email.py --certificate-id "$IN_CERT_ID" $TO_FLAG
