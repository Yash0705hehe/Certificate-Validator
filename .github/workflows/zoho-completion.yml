name: Zoho completion

# Fired by a Power Automate flow (via repository_dispatch) when Zoho Learn emails
# "<Learner> has completed course <Course>." Issues + emails that learner's
# certificate. Idempotent — a learner already holding the cert is skipped.
#
# Also runnable manually for testing (paste a subject line).
on:
  repository_dispatch:
    types: [zoho_completion]
  workflow_dispatch:
    inputs:
      subject:
        description: 'Test subject: "<Name> has completed course <Course>."'
        required: true
        type: string
      dry_run:
        description: "Dry run (resolve only; no writes/emails)"
        required: false
        default: false
        type: boolean

concurrency:
  group: zoho-completion
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Issue certificate from completion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
          ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_PORTAL: ${{ secrets.ZOHO_PORTAL }}
          ZOHO_COURSE_MAP: ${{ secrets.ZOHO_COURSE_MAP }}
          # repository_dispatch payload OR manual input:
          SUBJECT: ${{ github.event.client_payload.subject || github.event.inputs.subject }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          python issue_from_completion.py --subject "$SUBJECT" $FLAG
