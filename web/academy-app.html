   // routing\n      isLanding: s.view === \"landing\",\n      isCheckout: s.view === \"checkout\",\n      isUndertaking: s.view === \"undertaking\",\n      isGhgSeries: s.view === \"ghgSeries\",\n      isGhgCourse: s.view === \"ghgCourse\",\n      goGhgSeries: this.nav(\"ghgSeries\"),\n      goGhgCourse: this.nav(\"ghgCourse\"),\n      ...this.ghgSeriesData(),\n      ...this.ghgCourseData(),\n      goLanding: this.nav(\"landing\"),\n      goCheckout: this.nav(\"checkout\"),\n      goCheckoutIndividual: this.nav(\"checkout\", { isTeam: false }),\n      goCheckoutTeam: this.nav(\"checkout\", { isTeam: true, qty: Math.max(2, s.qty) }),\n      goUndertaking: (e) => {\n        e.preventDefault();\n        // carry name + email from checkout into the undertaking\n        this.go(\"undertaking\", { uName: s.uName || s.name, uEmail: s.uEmail || s.email });\n      },\n\n      // landing\n      trainings: decoratedTrainings,\n      programCount: trainings.filter(t => t.status === \"released\").length,\n      standardsMap, value, testimonials, faqs,\n\n      // checkout\n      paid: s.paid,\n      showCheckoutForm: !s.paid,\n      isTeam: s.isTeam, qty,\n      indivBorder: s.isTeam ? \"#E1E5EA\" : \"#244E6E\",\n      indivBg: s.isTeam ? \"#FFFFFF\" : \"rgba(36,78,110,0.06)\",\n      teamBorder: s.isTeam ? \"#244E6E\" : \"#E1E5EA\",\n      teamBg: s.isTeam ? \"rgba(36,78,110,0.06)\" : \"#FFFFFF\",\n      discountNote: qty >= 10 ? \"15% volume discount applied\" : qty >= 5 ? \"10% volume discount applied\" : \"5+ seats save 10% \u00b7 10+ save 15%\",\n      pickIndividual: () => this.setState({ isTeam: false }),\n      pickTeam: () => this.setState({ isTeam: true, qty: Math.max(2, s.qty) }),\n      inc: () => this.setState(st => ({ qty: st.qty + 1 })),\n      dec: () => this.setState(st => ({ qty: Math.max(2, st.qty - 1) })),\n      name: s.name, email: s.email, company: s.company, country: s.country,\n      card: s.card, exp: s.exp, cvc: s.cvc, promo: s.promo,\n      onName: e => this.setState({ name: e.target.value, showError: false }),\n      onEmail: e => this.setState({ email: e.target.value, showError: false }),\n      onCompany: e => this.setState({ company: e.target.value }),\n      onCountry: e => this.setState({ country: e.target.value }),\n      onCard: e => this.setState({ card: e.target.value, showError: false }),\n      onExp: e => this.setState({ exp: e.target.value, showError: false }),\n      onCvc: e => this.setState({ cvc: e.target.value, showError: false }),\n      onPromo: e => this.setState({ promo: e.target.value }),\n      applyPromo: () => this.setState({ appliedPromo: s.promo.trim().toUpperCase() === \"LAUNCH2\" ? \"LAUNCH2\" : \"invalid\" }),\n      perSeatStr: this.fmt(PRICE), subtotalStr: this.fmt(subtotal),\n      hasVolume: volPct > 0, volumePct: Math.round(volPct * 100) + \"%\", volumeStr: this.fmt(volume),\n      hasPromo: promoAmt > 0, promoCode, promoStr: this.fmt(promoAmt),\n      taxStr: this.fmt(tax), totalStr: this.fmt(total),\n      promoMsg, promoColor,\n      payBg: canPay ? \"#B08442\" : \"#C7CED4\",\n      payColor: canPay ? \"#12293D\" : \"#8A939C\",\n      payCursor: canPay ? \"pointer\" : \"not-allowed\",\n      showError: s.showError,\n      errorText: \"Please complete your details and payment information.\",\n      orderNo: \"AA-\" + (s.paid ? this._order : \"\"),\n      pay: () => {\n        if (!canPay) { this.setState({ showError: true }); return; }\n        this._order = \"26\" + Math.floor(1000 + Math.random() * 8999);\n        this.setState({ paid: true });\n        window.scrollTo(0, 0);\n      },\n\n      // undertaking\n      uSubmitted: s.uSubmitted,\n      uShowForm: !s.uSubmitted,\n      uName: s.uName, uEmail: s.uEmail, uPhone: s.uPhone, uLinkedin: s.uLinkedin,\n      uSavedName: s.uName.trim(),\n      uSavedDate: new Date().toLocaleDateString(undefined, { year: \"numeric\", month: \"long\", day: \"numeric\" }),\n      uOnName: e => this.setState({ uName: e.target.value, uShowError: false }),\n      uOnEmail: e => this.setState({ uEmail: e.target.value, uShowError: false }),\n      uOnPhone: e => this.setState({ uPhone: e.target.value }),\n      uOnLinkedin: e => this.setState({ uLinkedin: e.target.value }),\n      uToggleAgree: () => this.setState(st => ({ uAgreed: !st.uAgreed, uShowError: false })),\n      uCheckMark: s.uAgreed ? \"\u2713\" : \"\",\n      uBoxBg: s.uAgreed ? \"#244E6E\" : \"#FFFFFF\",\n      uBoxBorder: s.uAgreed ? \"#244E6E\" : \"#C2CAD2\",\n      uAgreeBg: s.uAgreed ? \"rgba(36,78,110,0.07)\" : \"#FFFFFF\",\n      uAgreeBorder: s.uAgreed ? \"#244E6E\" : \"#E1E5EA\",\n      uShowError: s.uShowError,\n      uErrorText: s.uName.trim().length === 0\n        ? \"Please enter your full name to continue.\"\n        : !this.emailOk(s.uEmail)\n        ? \"Please enter a valid email address.\"\n        : \"Please confirm you agree to the undertaking.\",\n      uBtnBg: uCanSubmit ? \"#12293D\" : \"#C7CED4\",\n      uBtnColor: uCanSubmit ? \"#F6F2E9\" : \"#8A939C\",\n      uBtnCursor: uCanSubmit ? \"pointer\" : \"not-allowed\",\n      uSubmit: () => {\n        if (!uCanSubmit) { this.setState({ uShowError: true }); return; }\n        this.setState({ uSubmitted: true });\n        window.scrollTo(0, 0);\n      },\n\n      // validator\n      vCertId: s.vCertId, vDate: s.vDate, vInputError: s.vInputError,\n      vOnCertId: e => this.setState({ vCertId: e.target.value, vInputError: false, vResult: null }),\n      vOnDate: e => this.setState({ vDate: e.target.value, vInputError: false, vResult: null }),\n      vResultValid: s.vResult === \"valid\",\n      vResultInvalid: s.vResult === \"invalid\",\n      vRecName: s.vRec ? s.vRec.name : \"\",\n      vRecDate: s.vRec ? this.fmtDate(s.vRec.date) : \"\",\n      vRecId: s.vRec ? s.vRec.id : \"\",\n      vVerify: async () => {\n        if (!s.vCertId.trim() || !s.vDate) { this.setState({ vInputError: true }); return; }\n        const entered = s.vCertId.trim().replace(/\\s+/g, \"\");\n        const SUPABASE_URL = \"https://ukhzxqxugzqcfqcwnmvu.supabase.co\";\n        const SUPABASE_ANON_KEY = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVraHp4cXh1Z3pxY2ZxY3dubXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzU2NTQsImV4cCI6MjA5OTI1MTY1NH0.S90pXFtBpsI5snlGCTVlNFesp02PwTH9wZU5cco-Bxw\";\n        this.setState({ vResult: null, vRec: null });\n        try {\n          const url = SUPABASE_URL + \"/functions/v1/validate-certificate?certificate_id=\" + encodeURIComponent(entered) + \"&date=\" + encodeURIComponent(s.vDate);\n          const resp = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: \"Bearer \" + SUPABASE_ANON_KEY } });\n          const data = await resp.json();\n          if (data && data.verified) {\n            this.setState({ vResult: \"valid\", vRec: { name: data.candidate_name, date: (data.completed_at || s.vDate).slice(0, 10), id: data.certificate_id } });\n          } else {\n            this.setState({ vResult: \"invalid\", vRec: null });\n          }\n        } catch (e) {\n          this.setState({ vResult: \"invalid\", vRec: null });\n        }\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>

<!-- AA Impact Academy — checkout + sample video wiring (added by Claude) -->
<script>
(function () {
  "use strict";
  var CHECKOUT_URL = "https://www.aaimpactinc.com/checkout";
  var VIDEO_SRC = "training-video.mp4"; // companion file hosted next to this page

  // 1) All "Enrol" CTAs go straight to the Wix checkout (no in-app checkout page).
  function isEnrolCta(t) {
    t = (t || "").toLowerCase().replace(/\s+/g, " ").trim();
    return t.indexOf("enrol as an individual") === 0 || t.indexOf("buy for a team") === 0 || t.indexOf("enrol now") === 0;
  }
  function ctaMatch(el) {
    for (var i = 0; i < 4 && el && el.nodeType === 1; i++, el = el.parentElement) {
      if ((el.tagName === "A" || el.tagName === "BUTTON" || el.getAttribute("role") === "button") && isEnrolCta(el.textContent)) return true;
    }
    return false;
  }
  document.addEventListener("click", function (ev) {
    if (!ctaMatch(ev.target)) return;
    ev.preventDefault(); ev.stopPropagation();
    try { window.top.location.href = CHECKOUT_URL; } catch (e) { window.open(CHECKOUT_URL, "_blank"); }
  }, true);

  // 2) Put the real sample video in the "Meet Zqi" player placeholder.
  function playerCard() {
    var all = document.querySelectorAll('div,section'), marker = null;
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (/sample lesson/i.test(e.textContent || '') && e.children.length <= 2 && (e.textContent || '').length < 40) { marker = e; break; }
    }
    if (!marker) return null;
    var el = marker;
    for (var j = 0; j < 9 && el; j++, el = el.parentElement) {
      var r = el.getBoundingClientRect();
      if (r.width >= 450 && r.height >= 360 && r.height <= 480) return el;
    }
    return null;
  }
  function injectVideo() {
    var box = playerCard();
    if (!box || box.querySelector('video.aai-video')) return;
    box.style.position = 'relative';
    box.style.overflow = 'hidden';
    var v = document.createElement('video');
    v.className = 'aai-video';
    v.src = VIDEO_SRC;
    v.controls = true; v.preload = 'metadata'; v.setAttribute('playsinline', '');
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b1620;z-index:20;border-radius:inherit';
    box.appendChild(v);
  }
  function start() { injectVideo(); new MutationObserver(injectVideo).observe(document.documentElement, { childList: true, subtree: true }); }
  if (document.readyState === 'complete') setTimeout(start, 400);
  else window.addEventListener('load', function () { setTimeout(start, 400); });
})();
</script>
