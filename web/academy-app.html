 is proprietary. To protect it \u2014 and the value of your own certification \u2014 every learner confirms the undertaking below.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 32px 40px 38px;\">\n          <label style=\"display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #566069; margin-bottom: 8px;\">Full name <span style=\"color: #B08442;\">*<\u002Fspan><\u002Flabel>\n          <input value=\"{{ uName }}\" sc-camel-on-input=\"{{ uOnName }}\" placeholder=\"e.g. Priya Sharma\" style=\"width: 100%; padding: 13px 15px; font-family: 'Archivo', sans-serif; font-size: 15px; color: #17242E; background: #FFFFFF; border: 1px solid #D2D8DE; border-radius: 6px; margin-bottom: 22px; outline: none;\" style-focus=\"border-color: #244E6E; box-shadow: 0 0 0 3px rgba(36,78,110,0.12);\">\n\n          <label style=\"display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #566069; margin-bottom: 8px;\">Email address <span style=\"color: #B08442;\">*<\u002Fspan><\u002Flabel>\n          <input type=\"email\" value=\"{{ uEmail }}\" sc-camel-on-input=\"{{ uOnEmail }}\" placeholder=\"you@company.com\" style=\"width: 100%; padding: 13px 15px; font-family: 'Archivo', sans-serif; font-size: 15px; color: #17242E; background: #FFFFFF; border: 1px solid #D2D8DE; border-radius: 6px; margin-bottom: 22px; outline: none;\" style-focus=\"border-color: #244E6E; box-shadow: 0 0 0 3px rgba(36,78,110,0.12);\">\n\n          <label style=\"display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #566069; margin-bottom: 8px;\">Contact number <span style=\"font-weight: 400; text-transform: none; letter-spacing: 0; color: #9AA6B0;\">\u2014 optional<\u002Fspan><\u002Flabel>\n          <input type=\"tel\" value=\"{{ uPhone }}\" sc-camel-on-input=\"{{ uOnPhone }}\" placeholder=\"+1 (416) 000-0000\" style=\"width: 100%; padding: 13px 15px; font-family: 'Archivo', sans-serif; font-size: 15px; color: #17242E; background: #FFFFFF; border: 1px solid #D2D8DE; border-radius: 6px; margin-bottom: 22px; outline: none;\" style-focus=\"border-color: #244E6E; box-shadow: 0 0 0 3px rgba(36,78,110,0.12);\">\n\n          <label style=\"display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #566069; margin-bottom: 8px;\">LinkedIn profile <span style=\"font-weight: 400; text-transform: none; letter-spacing: 0; color: #9AA6B0;\">\u2014 optional<\u002Fspan><\u002Flabel>\n          <input value=\"{{ uLinkedin }}\" sc-camel-on-input=\"{{ uOnLinkedin }}\" placeholder=\"linkedin.com/in/yourname\" style=\"width: 100%; padding: 13px 15px; font-family: 'Archivo', sans-serif; font-size: 15px; color: #17242E; background: #FFFFFF; border: 1px solid #D2D8DE; border-radius: 6px; margin-bottom: 26px; outline: none;\" style-focus=\"border-color: #244E6E; box-shadow: 0 0 0 3px rgba(36,78,110,0.12);\">\n\n          <div style=\"background: #FFFFFF; border: 1px solid #E1E5EA; border-radius: 8px; padding: 20px 22px; margin-bottom: 20px;\">\n            <div style=\"font-family: 'Newsreader', serif; font-size: 17px; color: #12293D; margin-bottom: 12px;\">The undertaking<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 13.5px; line-height: 1.55; color: #47535D;\">\n              <div style=\"display: flex; gap: 10px;\"><span style=\"color: #B08442; font-weight: 700;\">1.<\u002Fspan><span>I will not copy, record, reproduce, redistribute or resell any part of the course content \u2014 including videos, worksheets, templates, assessments or Zqi's guidance \u2014 in any form.<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px;\"><span style=\"color: #B08442; font-weight: 700;\">2.<\u002Fspan><span>I will not create derivative training, summaries or materials from this content, nor share my access credentials with any other person.<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px;\"><span style=\"color: #B08442; font-weight: 700;\">3.<\u002Fspan><span>I understand the material is the intellectual property of AA Impact Inc., that my access is for my personal learning only, and that breach may result in revoked access and further action.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div sc-camel-on-click=\"{{ uToggleAgree }}\" style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: {{ uAgreeBg }}; border: 1px solid {{ uAgreeBorder }}; border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: background 0.2s, border-color 0.2s;\">\n            <div style=\"width: 22px; height: 22px; flex-shrink: 0; border-radius: 5px; border: 2px solid {{ uBoxBorder }}; background: {{ uBoxBg }}; display: flex; align-items: center; justify-content: center; color: #F6F2E9; font-size: 14px; margin-top: 1px;\">{{ uCheckMark }}<\u002Fdiv>\n            <span style=\"font-size: 14px; line-height: 1.5; color: #17242E;\">I have read and agree to the undertaking above, and I confirm the details I have provided are accurate.<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ uShowError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: #B23A3A; margin: 6px 2px 4px;\">{{ uErrorText }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <button sc-camel-on-click=\"{{ uSubmit }}\" style=\"width: 100%; margin-top: 18px; padding: 15px; font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: {{ uBtnColor }}; background: {{ uBtnBg }}; border: none; border-radius: 4px; cursor: {{ uBtnCursor }}; transition: opacity 0.2s;\">Sign &amp; begin the course<\u002Fbutton>\n          <p style=\"font-size: 12px; color: #9AA6B0; text-align: center; margin-top: 14px; line-height: 1.5;\">Your signature is a digital record timestamped to your enrolment. Questions? <a href=\"#\">info@aaimpactinc.com<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 GHG TRAINING SERIES VIEW \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<sc-if value=\"{{ isGhgSeries }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:'Archivo',sans-serif;color:#17242E;background:#F6F2E9;-webkit-font-smoothing:antialiased;overflow-x:hidden\">\n\n  \n\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(246,242,233,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(22,36,29,.1)\">\n    <nav style=\"max-width:1240px;margin:0 auto;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goLanding }}\" style=\"display:flex;align-items:center;gap:12px;color:#12293D\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1.5px solid #12293D;border-radius:50%;font-family:'Newsreader',serif;font-weight:600;font-size:19px;letter-spacing:-1px\">A\u00b2<\u002Fspan>\n        <span style=\"font-family:'Newsreader',serif;font-size:19px;font-weight:600;letter-spacing:.2px\">AA Impact Inc.<\u002Fspan>\n      <\u002Fa>\n      <div style=\"display:flex;align-items:center;gap:34px\">\n        <div style=\"display:flex;gap:28px;font-size:14.5px;font-weight:500;color:#3E4A54\">\n          <a href=\"#why\" style=\"color:#3E4A54\">Why now<\u002Fa>\n          <a href=\"#courses\" style=\"color:#3E4A54\">The courses<\u002Fa>\n          <a href=\"#credible\" style=\"color:#3E4A54\">Credibility<\u002Fa>\n          <a href=\"#choose\" style=\"color:#3E4A54\">Choose a level<\u002Fa>\n        <\u002Fdiv>\n        <a href=\"#enrol\" style=\"display:inline-block;background:#12293D;color:#F6F2E9;padding:11px 22px;border-radius:2px;font-size:14px;font-weight:600;letter-spacing:.3px\" style-hover=\"background:#244E6E;color:#F6F2E9\">Enrol now<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"position:relative;background:#12293D;color:#F6F2E9;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:radial-gradient(1200px 500px at 78% -10%,rgba(90,140,190,.28),transparent 60%),radial-gradient(900px 600px at 0% 120%,rgba(176,132,66,.16),transparent 55%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto;padding:92px 40px 84px;\">\n      <div style=\"animation:fadeUp .7s ease both;max-width:760px\">\n        <div style=\"display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#D7C9A8;font-weight:600;margin-bottom:26px\">\n          <span style=\"width:26px;height:1px;background:#B08442\"><\u002Fspan>GHG Protocol Training Series\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(42px,5vw,68px);line-height:1.04;letter-spacing:-1px;margin:0 0 22px\">Two courses.<br><span style=\"font-style:italic;color:#E4D3AC\">The skills that hold up under scrutiny.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size:18.5px;line-height:1.6;color:rgba(246,242,233,0.82);max-width:560px;margin:0 0 34px;font-weight:400\">Learn to measure, report, and reduce what matters \u2014 built on the GHG Protocol, adopted by <strong style=\"color:#fff;font-weight:600\">92% of the Fortune 500<\u002Fstrong>, and ISO 14064-1:2018, the organisation-level ISO specification.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goGhgCourse }}\" style=\"display:inline-flex;align-items:center;gap:9px;background:#F6F2E9;color:#12293D;padding:15px 28px;border-radius:2px;font-size:15px;font-weight:700;letter-spacing:.2px\" style-hover=\"background:#E4D3AC;color:#12293D\">Explore the course <span style=\"font-family:'Newsreader',serif\">\u2192<\u002Fspan><\u002Fa>\n          <a href=\"#courses\" style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(246,242,233,.4);color:#F6F2E9;padding:15px 28px;border-radius:2px;font-size:15px;font-weight:600\" style-hover=\"border-color:#E4D3AC;color:#E4D3AC\">Compare the two levels<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- stat strip -->\n    <div style=\"position:relative;border-top:1px solid rgba(246,242,233,.14)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:repeat(4,1fr)\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"padding:26px 24px;border-left:1px solid rgba(246,242,233,.14)\">\n            <div style=\"font-family:'Newsreader',serif;font-size:38px;font-weight:500;color:#E4D3AC;line-height:1;letter-spacing:-1px\">{{ s.value }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:rgba(246,242,233,0.66);margin-top:9px;line-height:1.4\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY NOW -->\n  <section id=\"why\" style=\"max-width:1240px;margin:0 auto;padding:104px 40px 20px\">\n    <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start\">\n      <div style=\"position:sticky;top:110px\">\n        <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:18px\">Why this, why now<\u002Fdiv>\n        <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,3.6vw,46px);line-height:1.1;letter-spacing:-.5px;margin:0 0 20px;color:#12293D\">Disclosure is moving from voluntary to mandatory \u2014 everywhere.<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#566069;margin:0 0 28px\">Most professionals working on emissions inventories today are self-taught. They know the vocabulary \u2014 scope 1, scope 2, scope 3 \u2014 but have never formally studied the methodology behind it. That gap produces inventories that cannot withstand scrutiny.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-left:2px solid #B08442;padding-left:28px;margin-bottom:40px\">\n          <p style=\"font-family:'Newsreader',serif;font-style:italic;font-size:24px;line-height:1.45;color:#12293D;margin:0\">Tens of thousands of companies now disclose emissions data every year. The most common flags \u2014 incomplete Scope 3, misapplied market-based Scope 2, undocumented methodology \u2014 are training gaps, not data gaps.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:17px;line-height:1.75;color:#3E4A54;margin:0 0 22px\">Our training series is built around the standards that form the backbone of corporate emissions accounting: the GHG Protocol's <strong>Corporate Standard<\u002Fstrong>, <strong>Scope 2 Guidance<\u002Fstrong>, and <strong>Scope 3 Standard<\u002Fstrong>, plus <strong>ISO 14064-1:2018<\u002Fstrong> \u2014 each topic deliberately assigned to the Intermediate or Advanced tier.<\u002Fp>\n        <p style=\"font-size:17px;line-height:1.75;color:#3E4A54;margin:0\">Credible, consistent, verified emissions data protects an organisation from greenwashing accusations rather than exposing it to them. This is the fluency that does that.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THREE STANDARDS -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:80px 40px\">\n    <div style=\"text-align:center;max-width:640px;margin:0 auto 46px\">\n      <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:14px\">The framework<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,3.4vw,42px);line-height:1.12;margin:0;color:#12293D\">Four standards. One integrated curriculum.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px\">\n      <sc-for list=\"{{ standards }}\" as=\"st\" hint-placeholder-count=\"3\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(22,36,29,.1);border-radius:3px;padding:34px 30px;display:flex;flex-direction:column;min-height:300px\">\n          <div style=\"font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:#B08442;letter-spacing:.5px\">{{ st.year }}<\u002Fdiv>\n          <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:24px;line-height:1.2;margin:8px 0 16px;color:#12293D\">{{ st.name }}<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.65;color:#566069;margin:0 0 auto\">{{ st.governs }}<\u002Fp>\n          <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid rgba(22,36,29,.1);font-size:13px;color:#7C8794;line-height:1.5\"><strong style=\"color:#244E6E\">Covered in:<\u002Fstrong> {{ st.coverage }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COURSES -->\n  <section id=\"courses\" style=\"background:#EDE7D8;border-top:1px solid rgba(22,36,29,.08);border-bottom:1px solid rgba(22,36,29,.08)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:96px 40px\">\n      <div style=\"max-width:680px;margin:0 0 50px\">\n        <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:14px\">The courses<\u002Fdiv>\n        <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,3.6vw,46px);line-height:1.1;margin:0 0 16px;color:#12293D\">Two complete courses. Neither is a prerequisite for the other.<\u002Fh2>\n        <p style=\"font-size:17px;line-height:1.7;color:#566069;margin:0\">The Intermediate is not a simplified Advanced, and the Advanced is not a corrective for the Intermediate. Each is calibrated to a specific level of engagement \u2014 and each stands alone as a professional qualification.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n        <sc-for list=\"{{ courses }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.border }};border-radius:4px;padding:40px 36px;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n              <span style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:{{ c.accent }}\">{{ c.kicker }}<\u002Fspan>\n              <span style=\"font-family:'Newsreader',serif;font-size:15px;color:{{ c.muted }}\">{{ c.modules }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:32px;line-height:1.1;margin:0 0 10px\">{{ c.name }}<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;color:{{ c.muted }};margin:0 0 24px\">{{ c.blurb }}<\u002Fp>\n            <ul style=\"list-style:none;margin:0 0 28px;padding:0;display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ c.points }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <li style=\"display:flex;gap:11px;font-size:14.5px;line-height:1.5;color:{{ c.body }}\">\n                  <span style=\"color:{{ c.accent }};font-family:'Newsreader',serif;flex-shrink:0\">\u2014<\u002Fspan><span>{{ p }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n            <a href=\"#\" sc-camel-on-click=\"{{ goGhgCourse }}\" style=\"margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;color:{{ c.linkColor }};border-bottom:1px solid {{ c.accent }};padding-bottom:3px;font-size:14.5px;font-weight:600\">See the full syllabus <span style=\"font-family:'Newsreader',serif\">\u2192<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CREDIBILITY -->\n  <section id=\"credible\" style=\"max-width:1240px;margin:0 auto;padding:100px 40px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start\">\n      <div>\n        <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:16px\">What makes an inventory credible<\u002Fdiv>\n        <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,3.4vw,44px);line-height:1.1;margin:0 0 20px;color:#12293D\">Five principles that function as the quality standard for every decision.<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#566069;margin:0 0 18px\">A GHG inventory is only as good as its methodology. The GHG Protocol establishes five core accounting principles that govern which operations to include, which method to use, when to restate history, and how to disclose what you could not measure.<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#566069;margin:0\">Third-party verifiers, CDP reviewers, investor analysts, and regulators all evaluate inventories against these principles. Training builds the fluency to apply them confidently \u2014 and to defend them to external stakeholders.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;background:rgba(22,36,29,.1);border:1px solid rgba(22,36,29,.1);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ principles }}\" as=\"pr\" hint-placeholder-count=\"5\">\n          <div style=\"background:#FFFFFF;padding:22px 26px;display:flex;gap:20px;align-items:baseline\">\n            <span style=\"font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:#B08442;min-width:26px\">{{ pr.num }}<\u002Fspan>\n            <div>\n              <div style=\"font-family:'Newsreader',serif;font-size:20px;font-weight:600;color:#12293D;margin-bottom:3px\">{{ pr.name }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:#566069\">{{ pr.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BUSINESS CASE -->\n  <section style=\"background:#12293D;color:#F6F2E9\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:96px 40px\">\n      <div style=\"max-width:680px;margin:0 0 52px\">\n        <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#E4D3AC;font-weight:700;margin-bottom:14px\">Beyond compliance<\u002Fdiv>\n        <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,3.6vw,46px);line-height:1.1;margin:0;color:#F6F2E9\">The business case for building this capability in-house.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:rgba(246,242,233,.14);border:1px solid rgba(246,242,233,.14);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ businessCase }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div style=\"background:#12293D;padding:36px 34px\">\n            <div style=\"font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:#E4D3AC;margin-bottom:12px\">{{ b.title }}<\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.7;color:rgba(246,242,233,0.78);margin:0\">{{ b.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CHOOSE A LEVEL -->\n  <section id=\"choose\" style=\"max-width:1240px;margin:0 auto;padding:100px 40px\">\n    <div style=\"text-align:center;max-width:660px;margin:0 auto 50px\">\n      <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:14px\">A clear decision framework<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,3.4vw,44px);line-height:1.12;margin:0;color:#12293D\">Which level is right for you?<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n      <div style=\"border:1px solid rgba(22,36,29,.14);border-radius:4px;padding:36px 34px;background:#FFFFFF\">\n        <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:26px;margin:0 0 6px;color:#12293D\">Choose <span style=\"font-style:italic\">Intermediate<\u002Fspan> if you\u2026<\u002Fh3>\n        <div style=\"width:40px;height:2px;background:#B08442;margin:14px 0 22px\"><\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px\">\n          <sc-for list=\"{{ chooseIntermediate }}\" as=\"i\" hint-placeholder-count=\"7\">\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.5;color:#3E4A54\"><span style=\"color:#244E6E;flex-shrink:0\">\u2713<\u002Fspan><span>{{ i }}<\u002Fspan><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,36,29,.14);border-radius:4px;padding:36px 34px;background:#12293D;color:#F6F2E9\">\n        <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:26px;margin:0 0 6px;color:#F6F2E9\">Choose <span style=\"font-style:italic;color:#E4D3AC\">Advanced<\u002Fspan> if you\u2026<\u002Fh3>\n        <div style=\"width:40px;height:2px;background:#E4D3AC;margin:14px 0 22px\"><\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px\">\n          <sc-for list=\"{{ chooseAdvanced }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.5;color:rgba(246,242,233,0.82)\"><span style=\"color:#E4D3AC;flex-shrink:0\">\u2713<\u002Fspan><span>{{ a }}<\u002Fspan><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;background:#EDE7D8;border:1px dashed rgba(22,36,29,.25);border-radius:4px;padding:26px 32px;display:flex;gap:18px;align-items:baseline\">\n      <span style=\"font-family:'Newsreader',serif;font-size:22px;color:#B08442;font-style:italic\">Not sure?<\u002Fspan>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#3E4A54;margin:0\">If you regularly use \"scope 1, 2, 3\" in your work but can't explain the recalculation rules, the three uncertainty types, or the Scope 2 Quality Criteria \u2014 <strong>Advanced<\u002Fstrong> is the right choice. The <strong>Intermediate<\u002Fstrong> is the right start if this is your first structured engagement with the methodology.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ENROL / CTA -->\n  <section id=\"enrol\" style=\"background:#EDE7D8;border-top:1px solid rgba(22,36,29,.08)\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:100px 40px;text-align:center\">\n      <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:18px\">Enrol<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(34px,4.4vw,56px);line-height:1.08;letter-spacing:-.5px;margin:0 0 22px;color:#12293D\">Build emissions expertise that withstands scrutiny.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.65;color:#566069;max-width:600px;margin:0 auto 36px\">Take the Intermediate to build a complete foundation, the Advanced for practitioner depth, or both in sequence for the full practitioner path.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goCheckout }}\" style=\"background:#12293D;color:#F6F2E9;padding:16px 34px;border-radius:2px;font-size:15px;font-weight:700;letter-spacing:.2px\" style-hover=\"background:#244E6E;color:#F6F2E9\">Enquire about enrolment<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goGhgCourse }}\" style=\"border:1px solid rgba(22,36,29,.35);color:#12293D;padding:16px 34px;border-radius:2px;font-size:15px;font-weight:600\" style-hover=\"border-color:#B08442;color:#B08442\">Read the full course details<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:14px;color:#7C8794\">Enquiries: <a href=\"mailto:connect@aaimpactinc.com\" style=\"color:#244E6E\">connect@aaimpactinc.com<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#0C1E2D;color:rgba(246,242,233,0.66)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:52px 40px;display:flex;flex-wrap:wrap;gap:30px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;align-items:center;gap:12px;color:#F6F2E9\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1.5px solid #E4D3AC;border-radius:50%;font-family:'Newsreader',serif;font-weight:600;font-size:18px;color:#E4D3AC\">A\u00b2<\u002Fspan>\n        <div>\n          <div style=\"font-family:'Newsreader',serif;font-size:17px;color:#F6F2E9\">AA Impact Inc.<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#93A0AB\">Precision sustainability intelligence \u00b7 Toronto, Canada<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#93A0AB\">The GHG Protocol standards are free to download at <a href=\"https://ghgprotocol.org\" style=\"color:#E4D3AC\">ghgprotocol.org<\u002Fa>. This series builds working fluency with the methodology.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 GHG COURSE SYLLABUS VIEW \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<sc-if value=\"{{ isGhgCourse }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:'Archivo',sans-serif;color:#17242E;background:#F6F2E9;-webkit-font-smoothing:antialiased;overflow-x:hidden\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(246,242,233,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(22,36,29,.1)\">\n    <nav style=\"max-width:1240px;margin:0 auto;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goGhgSeries }}\" style=\"display:flex;align-items:center;gap:12px;color:#12293D\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1.5px solid #12293D;border-radius:50%;font-family:'Newsreader',serif;font-weight:600;font-size:19px;letter-spacing:-1px\">A\u00b2<\u002Fspan>\n        <span style=\"font-family:'Newsreader',serif;font-size:19px;font-weight:600;letter-spacing:.2px\">AA Impact Inc.<\u002Fspan>\n      <\u002Fa>\n      <div style=\"display:flex;align-items:center;gap:34px\">\n        <div style=\"display:flex;gap:28px;font-size:14.5px;font-weight:500;color:#3E4A54\">\n          <a href=\"#intermediate\" style=\"color:#3E4A54\">Intermediate<\u002Fa>\n          <a href=\"#advanced\" style=\"color:#3E4A54\">Advanced<\u002Fa>\n          <a href=\"#coverage\" style=\"color:#3E4A54\">Coverage<\u002Fa>\n          <a href=\"#reference\" style=\"color:#3E4A54\">Frameworks<\u002Fa>\n        <\u002Fdiv>\n        <a href=\"#\" sc-camel-on-click=\"{{ goCheckout }}\" style=\"display:inline-block;background:#12293D;color:#F6F2E9;padding:11px 22px;border-radius:2px;font-size:14px;font-weight:600;letter-spacing:.3px\" style-hover=\"background:#244E6E;color:#F6F2E9\">Enrol now<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- PAGE HERO -->\n  <section style=\"position:relative;background:#12293D;color:#F6F2E9;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:radial-gradient(1000px 480px at 85% -10%,rgba(90,140,190,.26),transparent 60%),radial-gradient(800px 500px at -5% 110%,rgba(176,132,66,.15),transparent 55%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1040px;margin:0 auto;padding:26px 40px 0\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goGhgSeries }}\" style=\"display:inline-flex;align-items:center;gap:8px;color:#D7C9A8;font-size:13.5px;font-weight:600\" style-hover=\"color:#E4D3AC\"><span style=\"font-family:'Newsreader',serif\">\u2190<\u002Fspan> Back to the training series<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:1040px;margin:0 auto;padding:40px 40px 78px\">\n      <div style=\"display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#D7C9A8;font-weight:600;margin-bottom:22px\">\n        <span style=\"width:26px;height:1px;background:#B08442\"><\u002Fspan>The GHG Accounting Course\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(40px,5.2vw,64px);line-height:1.05;letter-spacing:-1px;margin:0 0 22px;max-width:880px\">Every certification topic, mapped across <span style=\"font-style:italic;color:#E4D3AC\">two frameworks<\u002Fspan> and two tiers.<\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.6;color:rgba(246,242,233,0.82);max-width:700px;margin:0 0 8px\">The curriculum covers the full GHG Protocol suite \u2014 Corporate Standard, Scope 2 Guidance, Scope 3 Standard \u2014 and ISO 14064-1:2018. Every topic is deliberately assigned to the Intermediate or Advanced tier, so each course is complete on its own terms.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;border-top:1px solid rgba(246,242,233,.14)\">\n      <div style=\"max-width:1040px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1fr 1fr\">\n        <div style=\"padding:24px 24px 24px 0\">\n          <div style=\"font-family:'Newsreader',serif;font-size:15px;color:#E4D3AC;letter-spacing:1px;margin-bottom:4px\">LEVEL 1 \u00b7 3 MODULES<\u002Fdiv>\n          <div style=\"font-size:14px;color:rgba(246,242,233,0.66);line-height:1.5\">Intermediate \u2014 the complete foundation across both frameworks. Assumes no prior knowledge.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0 24px 24px;border-left:1px solid rgba(246,242,233,.14)\">\n          <div style=\"font-family:'Newsreader',serif;font-size:15px;color:#E4D3AC;letter-spacing:1px;margin-bottom:4px\">LEVEL 2 \u00b7 9 MODULES<\u002Fdiv>\n          <div style=\"font-size:14px;color:rgba(246,242,233,0.66);line-height:1.5\">Advanced \u2014 practitioner depth, reserved by design. Not a gap in the Intermediate; a deliberate second tier.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INTERMEDIATE -->\n  <section id=\"intermediate\" style=\"max-width:1040px;margin:0 auto;padding:96px 40px 30px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:10px\">\n      <span style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700\">Level 1<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:rgba(22,36,29,.15)\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,4vw,50px);line-height:1.06;letter-spacing:-.5px;margin:0 0 18px;color:#12293D\">The Intermediate Course \u2014 the complete foundation<\u002Fh2>\n    <p style=\"font-size:17.5px;line-height:1.7;color:#3E4A54;max-width:760px;margin:0 0 14px\">The complete foundation across the GHG Protocol suite and ISO 14064-1:2018, delivered in three modules: <strong>GHG Basics<\u002Fstrong>, <strong>Scope 1 &amp; 2<\u002Fstrong>, and <strong>Scope 3<\u002Fstrong>. The Intermediate goes considerably further than an introduction \u2014 all three organisational boundary approaches, the full range of calculation methods, both Scope 2 methods with the market instruments behind them, all 15 Scope 3 categories with data-collection and allocation methodology, and offsets and cap-and-trade.<\u002Fp>\n    <p style=\"font-size:17.5px;line-height:1.7;color:#3E4A54;max-width:760px;margin:0 0 44px\">By the end, learners can set an organisational boundary, classify and calculate emissions across all three scopes, interpret market instruments, build a first Scope 3 inventory, evaluate offset quality, and map a GHG Protocol inventory onto ISO 14064-1's categories.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <sc-for list=\"{{ interModules }}\" as=\"m\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:132px 1fr;gap:28px;background:#FFFFFF;border:1px solid rgba(22,36,29,.1);border-radius:4px;padding:30px 32px\">\n          <div>\n            <div style=\"font-family:'Newsreader',serif;font-size:13px;letter-spacing:1.5px;color:#B08442;font-weight:600;text-transform:uppercase\">Module<\u002Fdiv>\n            <div style=\"font-family:'Newsreader',serif;font-size:44px;font-weight:500;color:#244E6E;line-height:1;letter-spacing:-1px\">{{ m.n }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"font-family:'Newsreader',serif;font-weight:600;font-size:22px;line-height:1.25;margin:0 0 12px;color:#12293D\">{{ m.title }}<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.7;color:#566069;margin:0\">{{ m.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- topic coverage table -->\n    <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:28px;margin:56px 0 20px;color:#12293D\">What you can do after the Intermediate<\u002Fh3>\n    <div style=\"border:1px solid rgba(22,36,29,.12);border-radius:4px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;background:#12293D;color:#E4D3AC;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700\">\n        <div style=\"padding:14px 22px\">Topic area<\u002Fdiv>\n        <div style=\"padding:14px 22px;border-left:1px solid rgba(246,242,233,.14)\">What you can do<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ interTopics }}\" as=\"t\" hint-placeholder-count=\"13\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;background:{{ t.bg }};border-top:1px solid rgba(22,36,29,.08)\">\n          <div style=\"padding:16px 22px;font-size:14.5px;font-weight:600;color:#12293D;line-height:1.5\">{{ t.topic }}<\u002Fdiv>\n          <div style=\"padding:16px 22px;border-left:1px solid rgba(22,36,29,.08);font-size:14.5px;color:#566069;line-height:1.5\">{{ t.can }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- bridge topics -->\n    <div style=\"margin-top:26px;background:#EDE7D8;border:1px dashed rgba(22,36,29,.25);border-radius:4px;padding:26px 32px\">\n      <div style=\"font-family:'Newsreader',serif;font-style:italic;font-size:20px;color:#B08442;margin-bottom:8px\">Bridge topics<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.65;color:#3E4A54;margin:0\">A small set of topics is introduced at the Intermediate level and completed in full depth in the Advanced tier \u2014 base year and recalculation rules, mandatory reporting elements, the verification materiality threshold, the context of the 2015 Scope 2 amendment, and selected Scope 3 nuances (capital-goods treatment, downstream transport rules, data-prioritisation strategy). You get the working concepts first; the practitioner detail follows.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- who should take -->\n    <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:28px;margin:56px 0 8px;color:#12293D\">Who should take the Intermediate<\u002Fh3>\n    <p style=\"font-size:16px;line-height:1.6;color:#566069;max-width:720px;margin:0 0 26px\">Designed for anyone who needs to understand, communicate, or work with corporate GHG data \u2014 whether or not they build the inventory themselves.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <sc-for list=\"{{ interAudience }}\" as=\"a\" hint-placeholder-count=\"6\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(22,36,29,.1);border-radius:4px;padding:26px 28px\">\n          <div style=\"font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#244E6E;margin-bottom:8px\">{{ a.who }}<\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.65;color:#566069;margin:0\">{{ a.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ADVANCED -->\n  <section id=\"advanced\" style=\"background:#12293D;color:#F6F2E9;margin-top:80px\">\n    <div style=\"max-width:1040px;margin:0 auto;padding:96px 40px\">\n      <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:10px\">\n        <span style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#E4D3AC;font-weight:700\">Level 2<\u002Fspan>\n        <span style=\"height:1px;flex:1;background:rgba(246,242,233,.18)\"><\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,4vw,50px);line-height:1.06;letter-spacing:-.5px;margin:0 0 18px;color:#F6F2E9\">The Advanced Course \u2014 practitioner depth, reserved by design<\u002Fh2>\n      <p style=\"font-size:17.5px;line-height:1.7;color:rgba(246,242,233,0.82);max-width:760px;margin:0 0 14px\">Every Advanced topic is reserved by design: inventory quality systems and uncertainty, third-party assurance and verification readiness, target design under SBTi, the Scope 2 Quality Criteria and residual-mix rules, Scope 3 screening and category deep dives, and the demanding clauses of ISO 14064-1 \u2014 base year, quality management, reporting, and verification.<\u002Fp>\n      <p style=\"font-size:17.5px;line-height:1.7;color:rgba(246,242,233,0.82);max-width:760px;margin:0 0 44px\">This is the material practitioners are judged on: the judgment calls the standards don't prescribe, the rules verifiers test, and the methodology regulators and investors increasingly expect organisations to defend.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        <sc-for list=\"{{ advModules }}\" as=\"m\" hint-placeholder-count=\"9\">\n          <div style=\"background:rgba(246,242,233,.05);border:1px solid rgba(246,242,233,.14);border-radius:4px;padding:26px 26px;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\n              <span style=\"font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:#E4D3AC\">{{ m.code }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Newsreader',serif;font-weight:600;font-size:20px;line-height:1.25;margin:0 0 10px;color:#F6F2E9\">{{ m.title }}<\u002Fh3>\n            <p style=\"font-size:14px;line-height:1.65;color:rgba(246,242,233,0.78);margin:0\">{{ m.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- adv topic table -->\n      <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:28px;margin:56px 0 20px;color:#F6F2E9\">Advanced topics \u2014 why they matter in practice<\u002Fh3>\n      <div style=\"border:1px solid rgba(246,242,233,.16);border-radius:4px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:1fr 1.1fr;background:#0C1E2D;color:#E4D3AC;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700\">\n          <div style=\"padding:14px 22px\">Advanced topic<\u002Fdiv>\n          <div style=\"padding:14px 22px;border-left:1px solid rgba(246,242,233,.14)\">Why it matters<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ advTopics }}\" as=\"t\" hint-placeholder-count=\"15\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.1fr;background:{{ t.bg }};border-top:1px solid rgba(246,242,233,.1)\">\n            <div style=\"padding:16px 22px;font-size:14px;font-weight:600;color:#F6F2E9;line-height:1.5\">{{ t.topic }}<\u002Fdiv>\n            <div style=\"padding:16px 22px;border-left:1px solid rgba(246,242,233,.1);font-size:14px;color:rgba(246,242,233,0.78);line-height:1.5\">{{ t.why }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- REGIONAL REGULATORY TRACK -->\n      <div style=\"margin-top:64px;border-top:1px solid rgba(246,242,233,.16);padding-top:56px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n          <span style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#0C1E2D;background:#E4D3AC;border-radius:2px;padding:5px 12px\">Advanced exclusive<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.12;margin:0 0 14px;color:#F6F2E9\">Choose your region. Learn how its regulations move with the standards.<\u002Fh3>\n        <p style=\"font-size:16.5px;line-height:1.7;color:rgba(246,242,233,0.82);max-width:760px;margin:0 0 36px\">Every Advanced learner selects a regional regulatory track. The methodology is global \u2014 but the disclosure rules that invoke it are local. Your track teaches exactly how your region's framework builds on GHG Protocol and ISO 14064-1 accounting: which figures it requires, which methods it prescribes, and where its demands go beyond the standards.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"background:rgba(246,242,233,.05);border:1px solid rgba(246,242,233,.14);border-radius:4px;padding:26px 28px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px\">\n                <div style=\"font-family:'Newsreader',serif;font-size:20px;font-weight:600;color:#E4D3AC\">{{ r.region }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:#93A0AB\">{{ r.framework }}<\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:14.5px;line-height:1.65;color:rgba(246,242,233,0.78);margin:0\">{{ r.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.6;color:#93A0AB;margin:18px 0 0\">Working across markets? Additional regional tracks can be added to your enrolment \u2014 ask when you enrol.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:28px;margin:56px 0 8px;color:#F6F2E9\">Who should take the Advanced<\u002Fh3>\n      <p style=\"font-size:16px;line-height:1.6;color:rgba(246,242,233,0.78);max-width:720px;margin:0 0 26px\">For practitioners who work directly with GHG inventory methodology \u2014 building, reviewing, advising on, or designing the strategies that depend on it.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <sc-for list=\"{{ advAudience }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <div style=\"background:rgba(246,242,233,.05);border:1px solid rgba(246,242,233,.14);border-radius:4px;padding:26px 28px\">\n            <div style=\"font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:#E4D3AC;margin-bottom:8px\">{{ a.who }}<\u002Fdiv>\n            <p style=\"font-size:14.5px;line-height:1.65;color:rgba(246,242,233,0.78);margin:0\">{{ a.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COVERAGE MAP -->\n  <section id=\"coverage\" style=\"max-width:1040px;margin:0 auto;padding:96px 40px 30px\">\n    <div style=\"max-width:720px;margin:0 0 40px\">\n      <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:14px\">Curriculum map<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,3.6vw,44px);line-height:1.1;margin:0 0 16px;color:#12293D\">How the curriculum divides across the two tiers.<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#566069;margin:0\">Every certification topic in the curriculum is mapped to a tier: the Intermediate scope is the complete foundation; the rest is reserved for the Advanced tier.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(22,36,29,.12);border-radius:4px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#12293D;color:#E4D3AC;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700\">\n        <div style=\"padding:14px 22px\">Framework<\u002Fdiv>\n        <div style=\"padding:14px 16px\">Intermediate<\u002Fdiv>\n        <div style=\"padding:14px 22px 14px 16px\">Advanced tier<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ coverage }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr;background:{{ c.bg }};border-top:1px solid rgba(22,36,29,.08);align-items:start\">\n          <div style=\"padding:16px 22px;font-size:14.5px;font-weight:600;color:#12293D;line-height:1.4\">{{ c.fw }}<\u002Fdiv>\n          <div style=\"padding:16px;font-size:13.5px;color:#244E6E;line-height:1.55\">{{ c.inter }}<\u002Fdiv>\n          <div style=\"padding:16px 22px 16px 16px;font-size:13.5px;color:#8A6320;line-height:1.55\">{{ c.adv }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FRAMEWORK REFERENCE -->\n  <section id=\"reference\" style=\"max-width:1040px;margin:0 auto;padding:70px 40px 30px\">\n    <div style=\"max-width:720px;margin:0 0 40px\">\n      <div style=\"font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase;color:#B08442;font-weight:700;margin-bottom:14px\">Reference overview<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,3.6vw,44px);line-height:1.1;margin:0 0 16px;color:#12293D\">The standards, and how they map to the courses.<\u002Fh2>\n      <p style=\"font-size:16.5px;line-height:1.7;color:#566069;margin:0\">The GHG Protocol suite and ISO 14064-1:2018 form an integrated system. This overview shows what each governs and how coverage splits across the two levels.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <sc-for list=\"{{ frameworkRef }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(22,36,29,.12);border-radius:4px;padding:30px 32px;display:grid;grid-template-columns:.9fr 1.2fr;gap:32px\">\n          <div>\n            <div style=\"font-family:'Newsreader',serif;font-size:13px;letter-spacing:1px;color:#B08442;font-weight:600\">{{ f.year }}<\u002Fdiv>\n            <h3 style=\"font-family:'Newsreader',serif;font-weight:600;font-size:21px;line-height:1.2;margin:6px 0 14px;color:#12293D\">{{ f.name }}<\u002Fh3>\n            <div style=\"display:inline-flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"font-size:12px;font-weight:600;color:#244E6E;background:#EDE7D8;border:1px solid rgba(22,36,29,.12);border-radius:2px;padding:4px 10px\">Intermediate<\u002Fspan>\n              <span style=\"font-size:12px;font-weight:600;color:#F6F2E9;background:#244E6E;border-radius:2px;padding:4px 10px\">Advanced<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#93A0AB;font-weight:700;margin-bottom:8px\">What it governs<\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.7;color:#3E4A54;margin:0 0 16px\">{{ f.governs }}<\u002Fp>\n            <div style=\"font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#93A0AB;font-weight:700;margin-bottom:8px\">Course coverage<\u002Fdiv>\n            <p style=\"font-size:14.5px;line-height:1.6;color:#566069;margin:0\">{{ f.coverage }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FULL PATH + CTA -->\n  <section style=\"max-width:1040px;margin:0 auto;padding:40px 40px 30px\">\n    <div style=\"background:#EDE7D8;border:1px solid rgba(22,36,29,.12);border-radius:4px;padding:44px 44px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center\">\n      <div>\n        <div style=\"font-family:'Newsreader',serif;font-style:italic;font-size:22px;color:#B08442;margin-bottom:10px\">The full practitioner path<\u002Fdiv>\n        <p style=\"font-size:15.5px;line-height:1.7;color:#3E4A54;margin:0\">Take the Intermediate first for the complete foundation across both frameworks, then the Advanced for the practitioner tier. Taken in sequence, the two courses cover the full certification curriculum.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:stretch\">\n        <div style=\"flex:1;background:#FFFFFF;border:1px solid rgba(22,36,29,.12);border-radius:4px;padding:22px;text-align:center\">\n          <div style=\"font-family:'Newsreader',serif;font-size:34px;font-weight:500;color:#244E6E;line-height:1\">01<\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:600;color:#12293D;margin-top:6px\">Intermediate<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7C8794;margin-top:2px\">The complete foundation<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;font-family:'Newsreader',serif;font-size:24px;color:#B08442\">\u2192<\u002Fdiv>\n        <div style=\"flex:1;background:#12293D;border-radius:4px;padding:22px;text-align:center\">\n          <div style=\"font-family:'Newsreader',serif;font-size:34px;font-weight:500;color:#E4D3AC;line-height:1\">02<\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:600;color:#F6F2E9;margin-top:6px\">Advanced<\u002Fdiv>\n          <div style=\"font-size:12px;color:rgba(246,242,233,0.66);margin-top:2px\">Practitioner depth<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1040px;margin:0 auto;padding:50px 40px 100px;text-align:center\">\n    <h2 style=\"font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,4vw,50px);line-height:1.08;letter-spacing:-.5px;margin:0 0 20px;color:#12293D\">Ready to enrol?<\u002Fh2>\n    <p style=\"font-size:17.5px;line-height:1.6;color:#566069;max-width:560px;margin:0 auto 32px\">Tell us your level \u2014 or ask which is right for you \u2014 and we'll get you started.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goCheckout }}\" style=\"background:#12293D;color:#F6F2E9;padding:16px 34px;border-radius:2px;font-size:15px;font-weight:700;letter-spacing:.2px\" style-hover=\"background:#244E6E;color:#F6F2E9\">Enquire about enrolment<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ goGhgSeries }}\" style=\"border:1px solid rgba(22,36,29,.35);color:#12293D;padding:16px 34px;border-radius:2px;font-size:15px;font-weight:600\" style-hover=\"border-color:#B08442;color:#B08442\">Back to overview<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;font-size:14px;color:#7C8794\">Enquiries: <a href=\"mailto:connect@aaimpactinc.com\" style=\"color:#244E6E\">connect@aaimpactinc.com<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0C1E2D;color:rgba(246,242,233,0.66)\">\n    <div style=\"max-width:1040px;margin:0 auto;padding:48px 40px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;align-items:center;gap:12px;color:#F6F2E9\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1.5px solid #E4D3AC;border-radius:50%;font-family:'Newsreader',serif;font-weight:600;font-size:18px;color:#E4D3AC\">A\u00b2<\u002Fspan>\n        <div>\n          <div style=\"font-family:'Newsreader',serif;font-size:17px;color:#F6F2E9\">AA Impact Inc.<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#93A0AB\">GHG Certification Training \u00b7 Intermediate &amp; Advanced<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#93A0AB;max-width:420px\">The GHG Protocol standards are free at <a href=\"https://ghgprotocol.org\" style=\"color:#E4D3AC\">ghgprotocol.org<\u002Fa>; ISO 14064-1:2018 is available from ISO. This series builds working fluency \u2014 it does not replace the primary documents.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{}}\">\nclass Component extends DCLogic {\n  state = {\n    view: \"landing\",\n    openFaq: 0,\n    // checkout\n    isTeam: false, qty: 1,\n    name: \"\", email: \"\", company: \"\", country: \"\",\n    card: \"\", exp: \"\", cvc: \"\",\n    promo: \"\", appliedPromo: null,\n    paid: false, showError: false,\n    // undertaking\n    uName: \"\", uEmail: \"\", uPhone: \"\", uLinkedin: \"\", uAgreed: false, uSubmitted: false, uShowError: false,\n    // validator\n    vCertId: \"\", vDate: \"\", vInputError: false, vResult: null, vRec: null,\n  };\n\n  componentDidMount() {\n    const h = (location.hash || \"\").replace(\"#\", \"\");\n    if (h === \"checkout\" || h === \"undertaking\") {\n      this.setState({ view: h });\n      history.replaceState(null, \"\", location.pathname + location.search);\n    }\n  }\n\n  go(view, extra) {\n    this.setState({ view, ...(extra || {}) });\n    window.scrollTo(0, 0);\n  }\n  nav(view, extra) { return (e) => { if (e && e.preventDefault) e.preventDefault(); this.go(view, extra); }; }\n\n  fmt(n) { return \"$\" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n  emailOk(v) { return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v.trim()); }\n\n  // Mock backend registry of completed enrolments (replace with real records).\n  BACKEND = [\n    { name: \"Priya Sharma\", date: \"2026-06-15\" },\n    { name: \"Michael Chen\", date: \"2026-05-28\" },\n    { name: \"Aisha Khan\", date: \"2026-07-10\" },\n  ];\n\n  deriveId(name, date) {\n    const chars = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n    const seed = (name.trim().toLowerCase().replace(/\\s+/g, \" \") + \"|\" + date);\n    let h1 = 0x811c9dc5, h2 = 0x1000193;\n    for (let i = 0; i < seed.length; i++) {\n      const c = seed.charCodeAt(i);\n      h1 = (h1 ^ c) * 0x01000193 >>> 0;\n      h2 = (h2 * 31 + c) >>> 0;\n    }\n    let combined = (h1 >>> 0) * 0x100000000 + (h2 >>> 0);\n    let s = \"\";\n    for (let i = 0; i < 6; i++) { s += chars[combined % chars.length]; combined = Math.floor(combined / chars.length); }\n    const yr = date ? date.slice(0, 4) : String(new Date().getFullYear());\n    return \"AA-GHG-\" + yr + \"-\" + s;\n  }\n\n  fmtDate(d) {\n    if (!d) return \"\";\n    const dt = new Date(d + \"T00:00:00\");\n    if (isNaN(dt)) return d;\n    return dt.toLocaleDateString(undefined, { year: \"numeric\", month: \"long\", day: \"numeric\" });\n  }\n\n  ghgSeriesData() {\n    return {\n      stats: [\n        { value: \"2\", label: \"courses \u2014 the Intermediate foundation and the Advanced practitioner tier\" },\n        { value: \"12\", label: \"modules across the two courses\" },\n        { value: \"2\", label: \"frameworks: the GHG Protocol suite + ISO 14064-1:2018\" },\n        { value: \"92%\", label: \"of the Fortune 500 report using the GHG Protocol\" },\n      ],\n\n      standards: [\n        { year: \"2004\", name: \"Corporate Accounting & Reporting Standard\", governs: \"Scope 1 and 2 accounting; organisational and operational boundaries; calculation methods; base year and recalculation; offsets; reporting requirements.\", coverage: \"Intermediate + Advanced\" },\n        { year: \"2015\", name: \"Scope 2 Guidance (Amendment)\", governs: \"Location-based and market-based electricity accounting; quality criteria for contractual instruments; EACs, PPAs, green tariffs; residual mix; dual reporting.\", coverage: \"Intermediate + Advanced\" },\n        { year: \"2011\", name: \"Corporate Value Chain (Scope 3) Standard\", governs: \"All 15 value-chain categories; data collection methods; allocation methodology; mandatory reporting; target-setting under SBTi.\", coverage: \"Intermediate + Advanced\" },\n        { year: \"2018\", name: \"ISO 14064-1:2018\", governs: \"The organisation-level ISO specification: consolidation approaches, the six ISO inventory categories, quantification, quality management, reporting, verification, and annexes.\", coverage: \"Intermediate + Advanced\" },\n      ],\n      courses: [\n        {\n          kicker: \"Level 1\", name: \"Intermediate\", modules: \"3 modules\",\n          blurb: \"The complete, standalone foundation across the GHG Protocol suite and ISO 14064-1:2018 \u2014 considerably more than an introduction.\",\n          points: [\n            \"The GHG Protocol suite, the ISO 14064 family & the five principles\",\n            \"All three boundary approaches: Equity, Financial & Operational Control\",\n            \"Calculation methods: emission factors, CEM, mass balance, engineering\",\n            \"Scope 2 both methods + EACs (RECs, GOs, I-RECs), PPAs, green tariffs\",\n            \"All 15 Scope 3 categories + data-collection & allocation methods\",\n            \"Offsets, carbon credits, cap-and-trade & the golden rule\",\n            \"Reporting basics, biogenic CO\u2082 & ISO 14064-1 structure\",\n          ],\n          bg: \"#FFFFFF\", fg: \"#17242E\", border: \"rgba(22,36,29,.14)\",\n          accent: \"#B08442\", muted: \"#7C8794\", body: \"#3E4A54\", linkColor: \"#12293D\",\n        },\n        {\n          kicker: \"Level 2\", name: \"Advanced\", modules: \"9 modules\",\n          blurb: \"The practitioner tier \u2014 reserved by design for those who build, verify, and defend inventories under real-world complexity.\",\n          points: [\n            \"QA/QC systems, the three uncertainty types, and audit trails\",\n            \"Third-party assurance (limited vs. reasonable) & verification readiness\",\n            \"Reduction targets, SBTi requirements & Scope 3 target design\",\n            \"Six Scope 2 Quality Criteria, residual mix, null power, 24/7 matching\",\n            \"Scope 3 screening, advanced data methods & category deep dives\",\n            \"Cat 11 lifetime accounting & the PCAF attribution factor (Cat 15)\",\n            \"Scope 3 reporting requirements, CDP/GRI alignment & assurance\",\n            \"ISO 14064-1 Clauses 6.4\u201310: base year, quality management, reporting, verification\",\n            \"Your regional regulatory track: BRSR, ESRS E1, SECR, SEC & more\",\n          ],\n          bg: \"#244E6E\", fg: \"#F6F2E9\", border: \"rgba(22,36,29,.3)\",\n          accent: \"#E4D3AC\", muted: \"rgba(246,242,233,0.66)\", body: \"#F6F2E9\", linkColor: \"#F6F2E9\",\n        },\n      ],\n      principles: [\n        { num: \"01\", name: \"Relevance\", desc: \"The inventory reflects the emissions of the company and serves the decision-making needs of its users.\" },\n        { num: \"02\", name: \"Completeness\", desc: \"All emission sources within the chosen boundary are accounted for; every exclusion is disclosed and justified.\" },\n        { num: \"03\", name: \"Consistency\", desc: \"Methods are applied uniformly so emissions can be meaningfully compared year over year.\" },\n        { num: \"04\", name: \"Transparency\", desc: \"Assumptions, methods, and data sources are documented so any reviewer can reproduce the result.\" },\n        { num: \"05\", name: \"Accuracy\", desc: \"Quantification is neither systematically over nor under actual emissions, and uncertainty is reduced as far as practicable.\" },\n      ],\n      businessCase: [\n        { title: \"Investor pressure\", body: \"Institutional investors and ESG ratings agencies now routinely engage companies on climate risk. The ability to explain and defend your inventory methodology is essential in investor calls, ratings processes, and financing conversations.\" },\n        { title: \"Supply-chain requirements\", body: \"Large corporate buyers increasingly require \u2014 or strongly prefer \u2014 suppliers who can provide credible emissions data, and that requirement cascades down the value chain. Companies that can respond keep contracts; those that can't lose them.\" },\n        { title: \"Regulatory exposure\", body: \"Climate-disclosure regulation is expanding across major markets, and much of it is grounded in exactly this methodology. Organisations that build GHG capability now comply on their own terms; those that wait pay more \u2014 in time, consulting fees, and audit costs.\" },\n        { title: \"Talent differentiation\", body: \"Professionals who can build and defend an inventory, set science-based targets, and navigate procurement claims or value-chain allocation are genuinely rare. This training creates that capability.\" },\n      ],\n      chooseIntermediate: [\n        \"Are new to GHG accounting and need a structured, complete foundation\",\n        \"Work with emissions data but do not build inventories yourself\",\n        \"Need to communicate your organisation's emissions to external audiences\",\n        \"Are a finance or legal professional beginning to engage with disclosure\",\n        \"Are a procurement or supply-chain professional whose suppliers sion factors and their quality hierarchy, CEM, mass balance, engineering calculations. Scope 2 in both methods \u2014 location-based and market-based \u2014 with EACs (RECs, GOs, I-RECs), PPAs, green tariffs, matching rules, and the residual mix. Plus reporting fundamentals, biogenic CO\u2082, and ISO 14064-1 structure.\" },\n        { n: \"3\", title: \"Scope 3\", body: \"Why Scope 3 was formalised and why it commonly represents 70\u201390%+ of a footprint. All 15 categories defined with real examples and the boundary rules that keep them mutually exclusive. The full data-collection toolkit \u2014 spend-based, average-data, supplier-specific, hybrid, LCA \u2014 and allocation methodology: physical, economic, and system expansion, with the hierarchy for choosing between them.\" },\n      ],\n      interTopics: zebra([\n        { topic: \"The GHG Protocol suite and the ISO 14060 family\", can: \"Explain both frameworks and how they complement each other\" },\n        { topic: \"Five accounting principles (GHG Protocol + ISO wording)\", can: \"Apply principles as decision tools and defend methodology choices\" },\n        { topic: \"Equity Share, Financial Control, Operational Control\", can: \"Set an organisational boundary and handle JVs, franchises, and leases\" },\n        { topic: \"Scope 1: stationary, mobile, process, fugitive\", can: \"Classify any direct emission source correctly\" },\n        { topic: \"Calculation methods: emission factors, CEM, mass balance, engineering\", can: \"Choose the right method and perform the calculation\" },\n        { topic: \"Emission-factor quality hierarchy\", can: \"Select the highest-quality factors available for each source\" },\n        { topic: \"Scope 2 location-based and market-based methods\", can: \"Prepare and interpret both required Scope 2 figures\" },\n        { topic: \"EACs (RECs, GOs, I-RECs), PPAs, and green tariffs\", can: \"Understand the instruments behind any market-based claim\" },\n        { topic: \"All 15 Scope 3 categories and their boundary rules\", can: \"Identify applicable categories and structure the inventory\" },\n        { topic: \"Scope 3 data methods: spend, average, supplier-specific, hybrid, LCA\", can: \"Build a first Scope 3 estimate and plan improvements\" },\n        { topic: \"Allocation: physical, economic, system expansion\", can: \"Split shared emissions correctly and justify the method\" },\n        { topic: \"Offsets, credits, cap-and-trade, and the golden rule\", can: \"Evaluate offset quality and report gross emissions first\" },\n        { topic: \"Reporting elements, biogenic CO\u2082, and the 6 ISO categories\", can: \"Prepare compliant disclosures and map them to ISO 14064-1\" },\n      ]),\n      interAudience: [\n        { who: \"Sustainability Managers & ESG Analysts\", desc: \"Responsible for climate disclosures and need a rigorous understanding of the methodology behind the numbers \u2014 to build a defensible inventory and engage confidently with CDP and GRI.\" },\n        { who: \"Finance & Accounting Professionals\", desc: \"Emissions data is increasingly integrated into financial reporting under CSRD, ISSB, and SEC rules. Understand how numbers are calculated, why they change year-over-year, and when that requires restatement.\" },\n        { who: \"Corporate Communications & Investor Relations\", desc: \"Communicate emissions performance accurately and compellingly. Knowing what the numbers can and cannot claim protects against greenwashing risk and builds credibility with sophisticated audiences.\" },\n        { who: \"Operations, Procurement & Supply Chain\", desc: \"Scope 3 is generated by what you buy, ship, and how products are used. Engage meaningfully with supplier data and evaluate low-carbon procurement options.\" },\n        { who: \"Sustainability Consultants \u2014 building a practice\", desc: \"A solid foundation in methodology, not just vocabulary \u2014 the structured knowledge that separates competent practitioners from those relying on shortcuts.\" },\n        { who: \"Senior Leaders & Board Members\", desc: \"Climate risk is a board-level issue. Conceptual fluency supports better decisions on disclosure strategy, target-setting, and capital allocation for decarbonisation.\" },\n      ],\n      advModules: [\n        { code: \"A1\", title: \"Inventory Quality: QA/QC & Uncertainty\", body: \"Why activity data quality is the biggest practical limitation in most inventories. Internal QC checks, centralised vs. decentralised data collection, the three uncertainty types (parameter, model, scientific), how to document and disclose uncertainty, and building an audit trail anyone can reproduce from documentation alone.\" },\n        { code: \"A2\", title: \"Assurance & Verification Readiness\", body: \"Limited vs. reasonable assurance \u2014 what each covers and costs \u2014 and why third-party verification is increasingly expected by investors, CDP, and regulators. ISO 14064-1 Clause 10: impartial, objective verification per ISO 14064-3, and how verification-readiness shapes inventory design from day one.\" },\n        { code: \"A3\", title: \"Reduction Targets & Science-Based Targets\", body: \"Why a target without a proper baseline is not credible. Absolute vs. intensity targets and their trade-offs; the key design decisions \u2014 boundary, base year, target year, gas coverage, offset and double-counting policy; what makes SBTs different from self-set targets; and tracking and publicly reporting progress annually.\" },\n        { code: \"A4\", title: \"Scope 2: The Six Quality Criteria\", body: \"What makes a contractual instrument valid for the market-based method: disclosure, tracking, current-year vintage, unique redemption, market boundary, and generation attributes \u2014 and why a company can legitimately show very different Scope 2 figures under each method.\" },\n        { code: \"A5\", title: \"Scope 2: Residual Mix, Null Power & 24/7\", body: \"The single most egories, quantification\", adv: \"Base year (6.4), quality management, reporting, verification\" },\n        { fw: \"ISO 14064-1:2018 Annexes\", inter: \"Key annexes introduced\", adv: \"Annexes C\u2013H in full depth\" },\n      ]),\n      frameworkRef: [\n        { year: \"2004\", name: \"GHG Protocol Corporate Standard\", governs: \"Scope 1 and 2 accounting; organisational and operational boundary-setting; calculation methods; base year and recalculation; offsets; reporting requirements.\", coverage: \"Intermediate: principles, all boundary approaches, calculation methods, offsets, reporting basics. Advanced: QA/QC and uncertainty, assurance, reduction targets and SBTs.\" },\n        { year: \"2015\", name: \"Scope 2 Guidance (Amendment)\", governs: \"Location-based and market-based electricity accounting; quality criteria for contractual instruments; EACs, PPAs, green tariffs; residual mix; dual-reporting requirement.\", coverage: \"Intermediate: both methods, EAC types, PPAs, green tariffs, matching rules. Advanced: the six Quality Criteria, residual mix and null power rules, 24/7 matching, Scope 2 targets.\" },\n        { year: \"2011\", name: \"Scope 3 Standard\", governs: \"All 15 value-chain categories; data-collection methods; allocation methodology; mandatory reporting requirements; target-setting under SBTi.\", coverage: \"Intermediate: all 15 categories, data-collection toolkit, allocation hierarchy. Advanced: screening, category deep dives (Cat 11 lifetime accounting, PCAF Cat 15), reporting requirements, target-setting.\" },\n        { year: \"2018\", name: \"ISO 14064-1:2018\", governs: \"The organisation-level specification for quantifying and reporting GHG emissions and removals \u2014 consolidation approaches, the six ISO inventory categories, quantification, quality management, reporting, and verification, plus normative and informative annexes.\", coverage: \"Intermediate: the ISO 14060 family, terms, principles, boundaries, the six categories,
