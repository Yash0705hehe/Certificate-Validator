document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{ transform: scale(1); opacity: 1; } }\n  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n  html { scroll-behavior: smooth; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 100%; overflow-x: hidden;\">\n\n\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 LANDING VIEW \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <!-- NAV -->\n  <nav style=\"position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 18px 48px; background: rgba(246,242,233,0.86); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(22,36,29,0.1);\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n      <span style=\"font-family: 'Newsreader', serif; font-size: 25px; font-weight: 500; letter-spacing: -0.01em; color: #12293D;\">AA Impact<\u002Fspan>\n      <span style=\"font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #7C8794;\">Academy<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 34px;\">\n      <a href=\"#trainings\" style=\"font-size: 14px; color: #33434F;\">Trainings<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ goGhgSeries }}\" style=\"font-size: 14px; color: #33434F;\">GHG Training Series<\u002Fa>\n      <a href=\"#zqi\" style=\"font-size: 14px; color: #33434F;\">Meet Zqi<\u002Fa>\n      <a href=\"#standards\" style=\"font-size: 14px; color: #33434F;\">Standards<\u002Fa>\n      <a href=\"#validate\" style=\"font-size: 14px; color: #33434F;\">Validate Certificate<\u002Fa>\n      <a href=\"#faq\" style=\"font-size: 14px; color: #33434F;\">FAQ<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ goCheckout }}\" style=\"display: inline-block; padding: 10px 20px; background: #12293D; color: #F6F2E9; border-radius: 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;\">Enrol Now<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <header style=\"position: relative; padding: 96px 48px 108px; background: linear-gradient(165deg, #12293D 0%, #163449 55%, #1B4462 100%); color: #F6F2E9; overflow: hidden;\">\n    <div style=\"position: absolute; top: -120px; right: -80px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(176,132,66,0.28), transparent 70%);\"><\u002Fdiv>\n    <div style=\"position: absolute; bottom: -160px; left: -100px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(90,140,190,0.22), transparent 70%);\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 1120px; margin: 0 auto;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px; border: 1px solid rgba(246,242,233,0.28); border-radius: 40px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #D7C9A8; margin-bottom: 30px;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #B08442; display: inline-block;\"><\u002Fspan>\n        Compliance-grade training \u00b7 Self-paced \u00b7 Enrol anytime\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 68px; line-height: 1.04; letter-spacing: -0.02em; max-width: 900px; margin-bottom: 26px;\">\n        Where regulatory fluency becomes<br><span style=\"font-style: italic; color: #E4D3AC;\">strategic advantage.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 19px; line-height: 1.6; max-width: 620px; color: rgba(246,242,233,0.82); margin-bottom: 40px;\">\n        A growing library of practitioner-built programs that move your team from disclosure obligation to decision-grade capability \u2014 each mapped directly to the standards auditors and regulators actually apply. New modules are added regularly.\n      <\u002Fp>\n      <div style=\"display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 56px;\">\n        <a href=\"#trainings\" style=\"display: inline-block; padding: 15px 30px; background: #B08442; color: #12293D; border-radius: 2px; font-size: 15px; font-weight: 700; letter-spacing: 0.02em;\">Explore the Programs<\u002Fa>\n        <a href=\"#zqi\" style=\"display: inline-block; padding: 15px 30px; background: transparent; color: #F6F2E9; border: 1px solid rgba(246,242,233,0.4); border-radius: 2px; font-size: 15px; font-weight: 600;\">Meet Zqi, your AI trainer<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 48px; flex-wrap: wrap; padding-top: 34px; border-top: 1px solid rgba(246,242,233,0.16);\">\n        <div><div style=\"font-family: 'Newsreader', serif; font-size: 34px; color: #E4D3AC;\">{{ programCount }}<\u002Fdiv><div style=\"font-size: 13px; color: rgba(246,242,233,0.66); letter-spacing: 0.04em;\">Programs live now<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'Newsreader', serif; font-size: 34px; color: #E4D3AC;\">12+<\u002Fdiv><div style=\"font-size: 13px; color: rgba(246,242,233,0.66); letter-spacing: 0.04em;\">Frameworks on the roadmap<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'Newsreader', serif; font-size: 34px; color: #E4D3AC;\">Zqi<\u002Fdiv><div style=\"font-size: 13px; color: rgba(246,242,233,0.66); letter-spacing: 0.04em;\">Trainer in every lesson<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'Newsreader', serif; font-size: 34px; color: #E4D3AC;\">100%<\u002Fdiv><div style=\"font-size: 13px; color: rgba(246,242,233,0.66); letter-spacing: 0.04em;\">Standards-aligned<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- COMPLIANCE NARRATIVE -->\n  <section style=\"padding: 84px 48px; background: #F6F2E9;\">\n    <div style=\"max-width: 1000px; margin: 0 auto; text-align: center;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #B08442; margin-bottom: 20px;\">Why this matters now<\u002Fdiv>\n      <h2 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 40px; line-height: 1.2; letter-spacing: -0.01em; color: #12293D; margin-bottom: 24px;\">\n        Compliance is no longer a filing exercise. It is a competence your organisation either holds \u2014 or borrows at a premium.\n      <\u002Fh2>\n      <p style=\"font-size: 18px; line-height: 1.7; color: #3E4A54; max-width: 780px; margin: 0 auto;\">\n        As ESRS, ISSB, TNFD and sector mandates converge, the gap between teams that <em>understand<\u002Fem> the standards and teams that merely respond to them is widening fast. AA Impact Academy closes that gap \u2014 turning regulatory obligation into internal capability that compounds across every disclosure cycle.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ZQI -->\n  <section id=\"zqi\" style=\"padding: 92px 48px; background: #122A3D; color: #F6F2E9;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;\">\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #D7C9A8; margin-bottom: 18px;\">Your course trainer<\u002Fdiv>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 46px; line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 22px;\">Meet <span style=\"font-style: italic; color: #E4D3AC;\">Zqi<\u002Fspan> \u2014 the trainer who leads every lesson.<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.7; color: rgba(246,242,233,0.82); margin-bottom: 28px;\">\n          Zqi is the expert instructor who guides you through the programs on screen. Warm, precise and endlessly clear, Zqi turns dense standards into lessons that actually land \u2014 walking you through the reasoning behind each requirement, not just the checkbox. Every module is taught, demonstrated and worked through with you, one video at a time.\n        <\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; gap: 14px; align-items: flex-start;\"><span style=\"color: #B08442; font-size: 18px;\">\u25c6<\u002Fspan><span style=\"font-size: 15px; line-height: 1.5; color: rgba(246,242,233,0.9);\"><strong>Expert-led lessons.<\u002Fstrong> Zqi carries the judgment of senior practitioners into every video.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px; align-items: flex-start;\"><span style=\"color: #B08442; font-size: 18px;\">\u25c6<\u002Fspan><span style=\"font-size: 15px; line-height: 1.5; color: rgba(246,242,233,0.9);\"><strong>Worked, not lectured.<\u002Fstrong> Real scenarios from live engagements, demonstrated step by step.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px; align-items: flex-start;\"><span style=\"color: #B08442; font-size: 18px;\">\u25c6<\u002Fspan><span style=\"font-size: 15px; line-height: 1.5; color: rgba(246,242,233,0.9);\"><strong>Watch at your pace.<\u002Fstrong> Rewind, revisit and pick up exactly where you left off.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #0C1E2D; border: 1px solid rgba(176,132,66,0.35); border-radius: 12px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.35);\">\n        <div style=\"position: relative; aspect-ratio: 16/9; background: linear-gradient(150deg, #1B4462, #0C1E2D); display: flex; align-items: center; justify-content: center;\">\n          <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #F6F2E9;\">\n            <div style=\"width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(228,211,172,0.5); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #E4D3AC;\">\u25b6<\u002Fdiv>\n            <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(246,242,233,0.7);\">Sample lesson \u2014 Scope 1 &amp; 2<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 18px 20px;\">\n          <div style=\"height: 4px; border-radius: 4px; background: rgba(246,242,233,0.15); margin-bottom: 14px;\"><div style=\"width: 42%; height: 100%; border-radius: 4px; background: #B08442;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <div style=\"width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #B08442, #E4D3AC); display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', serif; font-weight: 600; color: #12293D; font-size: 20px;\">Z<\u002Fdiv>\n            <div><div style=\"font-weight: 600; font-size: 15px; color: #F6F2E9;\">Meet Z-Qi<\u002Fdiv><div style=\"font-size: 12px; color: #7C97AE;\">AA Impact Academy<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TRAININGS -->\n  <section id=\"trainings\" style=\"padding: 92px 48px; background: #F6F2E9;\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 48px;\">\n        <div>\n          <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #B08442; margin-bottom: 16px;\">The program library<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; color: #12293D; max-width: 640px;\">Every module tied to a standard you will be measured against.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; color: #566069; max-width: 300px; line-height: 1.6;\">Self-paced video, led by Zqi and reviewed by AA Impact senior practitioners. More modules are on the way.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;\">\n        <sc-for list=\"{{ trainings }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid rgba(22,36,29,0.1); border-radius: 10px; overflow: hidden; transition: transform 0.25s, box-shadow 0.25s;\" style-hover=\"transform: translateY(-6px); box-shadow: 0 24px 48px rgba(18,41,61,0.14);\">\n            <div style=\"padding: 26px 26px 20px; background: {{ t.headerBg }}; color: #F6F2E9;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;\">\n                <span style=\"font-family: 'Newsreader', serif; font-size: 15px; color: rgba(246,242,233,0.7);\">{{ t.number }}<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 11px; border: 1px solid rgba(246,242,233,0.35); border-radius: 30px;\">{{ t.level }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 27px; line-height: 1.12; margin-bottom: 10px;\">{{ t.title }}<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.55; color: rgba(246,242,233,0.82); margin-bottom: 14px;\">{{ t.tagline }}<\u002Fp>\n              <sc-if value=\"{{ t.isSoon }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px; background: rgba(176,132,66,0.18); color: #E4D3AC; border: 1px solid rgba(176,132,66,0.5); border-radius: 30px;\">\u25f7 {{ t.statusLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ t.isReleased }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px; background: rgba(111,168,199,0.22); color: #CFE3F0; border: 1px solid rgba(111,168,199,0.55); border-radius: 30px;\">\u25cf {{ t.statusLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding: 22px 26px 28px; display: flex; flex-direction: column; flex: 1;\">\n              <div style=\"display: flex; gap: 20px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid rgba(22,36,29,0.08);\">\n                <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #93A0AB;\">Format<\u002Fdiv><div style=\"font-size: 14px; font-weight: 600; color: #17242E; margin-top: 3px;\">{{ t.format }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #93A0AB;\">Trainer<\u002Fdiv><div style=\"font-size: 14px; font-weight: 600; color: #17242E; margin-top: 3px;\">Zqi<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #93A0AB; margin-bottom: 10px;\">Aligned to<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px;\">\n                <sc-for list=\"{{ t.standards }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <span style=\"font-size: 12px; font-weight: 600; padding: 5px 10px; background: #E9EEF3; color: #244E6E; border-radius: 4px; border: 1px solid rgba(36,78,110,0.15);\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #93A0AB; margin-bottom: 10px;\">You will be able to<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; flex: 1;\">\n                <sc-for list=\"{{ t.outcomes }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; color: #3E4A54;\"><span style=\"color: #B08442; margin-top: 1px;\">\u2713<\u002Fspan><span>{{ o }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ t.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 12.5px; line-height: 1.45; color: #566069; background: #F3F0E7; border-left: 3px solid #B08442; padding: 10px 12px; border-radius: 0 4px 4px 0; margin-bottom: 20px;\">{{ t.note }} <a href=\"#enroll\" style=\"font-weight: 600;\">Join the Advanced waitlist \u2192<\u002Fa><\u002Fdiv>\n              <\u002Fsc-if>\n              <a href=\"#\" sc-camel-on-click=\"{{ t.go }}\" style=\"display: block; text-align: center; padding: 12px; background: #12293D; color: #F6F2E9; border-radius: 3px; font-size: 14px; font-weight: 600;\">{{ t.cta }}<\u002Fa>\n              <sc-if value=\"{{ t.isReleased }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"#\" sc-camel-on-click=\"{{ goGhgCourse }}\" style=\"display: block; text-align: center; padding: 11px; margin-top: 8px; border: 1px solid rgba(18,41,61,0.3); color: #12293D; border-radius: 3px; font-size: 13.5px; font-weight: 600;\">View the full syllabus \u2192<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- STANDARDS MAP -->\n  <section id=\"standards\" style=\"padding: 92px 48px; background: linear-gradient(180deg, #12293D, #142F44);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; color: #F6F2E9;\">\n      <div style=\"text-align: center; margin-bottom: 52px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #D7C9A8; margin-bottom: 16px;\">The compliance map<\u002Fdiv>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 42px; line-height: 1.14; letter-spacing: -0.02em; max-width: 720px; margin: 0 auto 16px;\">Every module traces to a named standard \u2014 no orphaned learning.<\u002Fh2>\n        <p style=\"font-size: 16px; color: rgba(246,242,233,0.72); max-width: 620px; margin: 0 auto; line-height: 1.6;\">When your auditor asks where a number comes from, your team should already know the clause. This is how we build that reflex.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n        <sc-for list=\"{{ standardsMap }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"background: rgba(246,242,233,0.05); border: 1px solid rgba(246,242,233,0.14); border-radius: 10px; padding: 26px;\">\n            <div style=\"font-family: 'Newsreader', serif; font-size: 19px; color: #E4D3AC; margin-bottom: 16px;\">{{ m.pillar }}<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <sc-for list=\"{{ m.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 11px; border-bottom: 1px solid rgba(246,242,233,0.08);\">\n                  <span style=\"font-size: 13.5px; font-weight: 600; color: #F6F2E9;\">{{ i.name }}<\u002Fspan>\n                  <span style=\"font-size: 12px; color: rgba(246,242,233,0.6); text-align: right;\">{{ i.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- OUTCOMES / VALUE -->\n  <section style=\"padding: 92px 48px; background: #F6F2E9;\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 52px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #B08442; margin-bottom: 16px;\">The return on capability<\u002Fdiv>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 400; font-size: 42px; line-height: 1.14; letter-spacing: -0.02em; color: #12293D; max-width: 700px; margin: 0 auto;\">What changes when the standards live inside your team.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;\">\n        <sc-for list=\"{{ value }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <div style=\"background: #FFFFFF; border: 1px solid rgba(22,36,29,0.1); border-radius: 10px; padding: 28px 24px;\">\n            <div style=\"font-family: 'Newsreader', serif; font-size: 40px; color: #B08442; margin-bottom: 12px;\">{{ v.stat }}<\u002Fdiv>\n            <div style=\"font-size: 15px; font-weight: 600; color: #17242E; margin-bottom: 8px;\">{{ v.title }}<\u002Fdiv>\n            <p style=\"font-size: 13.5px; line-height: 1.55; color: #566069;\">{{ v.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TESTIMONIALS -->\n  <section style=\"padding: 84px 48px; background: #EDE7D8;\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #B08442; margin-bottom: 40px; text-align: center;\">From the field<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;\">\n        <sc-for list=\"{{ testimonials }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"background: #FFFFFF; border-radius: 10px; padding: 30px; display: flex; flex-direction: column; border: 1px solid rgba(22,36,29,0.08);\">\n            <div style=\"font-family: 'Newsreader ding: 20px; background: linear-gradient(135deg, #1B4462, #244E6E); color: #F6F2E9; text-align: center;\">\n              <div style=\"font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #E4D3AC; margin-bottom: 8px;\">Valid certificate<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.04em; color: #FFFFFF; animation: pop 0.4s ease;\">{{ vRecId }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; justify-content: space-between; gap: 16px;\"><span style=\"font-size: 13px; color: #7C8794;\">Participant<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; text-align: right;\">{{ vRecName }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; gap: 16px;\"><span style=\"font-size: 13px; color: #7C8794;\">Program<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; text-align: right;\">GHG Accounting \u2014 Intermediate<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; gap: 16px;\"><span style=\"font-size: 13px; color: #7C8794;\">Completed<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; text-align: right;\">{{ vRecDate }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ vResultInvalid }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: #FBEDEC; border: 1px solid #F0CBC8; border-radius: 10px; animation: fadeup 0.4s ease;\">\n            <div style=\"width: 34px; height: 34px; border-radius: 50%; background: #B23A3A; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 18px; flex-shrink: 0;\">!<\u002Fdiv>\n
